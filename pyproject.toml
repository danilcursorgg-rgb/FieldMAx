[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "narefield"
version = "0.1.0"
description = "Operational NARE-Field primitives: predictive-energy loss, memory field, and Anthill routing."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "NARELabs" }]
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
